<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background: subtle surface color -->
  <rect width="32" height="32" rx="6" fill="#1a1d1b"/>

  <!-- Page/document shape -->
  <rect x="6" y="4" width="16" height="24" rx="2" fill="#252a27" stroke="#d4a574" stroke-width="1.5"/>

  <!-- Text lines on page -->
  <line x1="9" y1="9" x2="19" y2="9" stroke="#585858" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="9" y1="13" x2="19" y2="13" stroke="#585858" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="9" y1="17" x2="16" y2="17" stroke="#585858" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="9" y1="21" x2="19" y2="21" stroke="#585858" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Marginal annotation mark (the "scholia") -->
  <circle cx="25" cy="12" r="5" fill="#d4a574"/>
  <path d="M23 12 L25 14 L28 10" stroke="#1a1d1b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
